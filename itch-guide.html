/* Identidad de womengamejam.org: violeta profundo, rosa y amarillo. Tema oscuro único. */
:root {
  --bg: #12002f;
  --bg-2: #1a0240;
  --surface: #210749;
  --surface-2: #2c0d51;
  --field: rgba(255, 255, 255, .07);
  --text: #ffffff;
  --muted: #cbbde6;
  --border: #4a3272;
  --primary: #ff007a;
  --primary-soft: #ff6bb0;
  --accent: #ffeb3b;
  --accent-text: #12002f;
  --danger: #ff8fa3;
  --ok: #77cf45;
  --warning: #ffb74d;
  --core: #ff6bb0;
  --improvement: #4dd0e1;
  --after: #a99bc4;
  --shadow: 0 2px 4px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --radius: 12px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 12% -5%, rgba(255, 0, 122, .22), transparent 38%),
    radial-gradient(circle at 95% 8%, rgba(124, 58, 237, .28), transparent 42%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font: 500 15px/1.55 "Montserrat", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}

button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { overflow-wrap: anywhere; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { color: #fff; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

[hidden] { display: none !important; }

/* Encabezado */
.app-header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding: 12px 20px; background: rgba(18, 0, 47, .95); border-bottom: 2px solid var(--primary);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand-logo { width: 64px; height: auto; display: block; }
.brand-title { font-size: 17px; font-weight: 900; margin: 0; line-height: 1.2; }
.header-status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.header-actions { display: flex; align-items: center; gap: 8px; }

.badge {
  border: 2px solid var(--border); background: var(--surface-2); border-radius: 999px;
  padding: 4px 14px; font-weight: 800; cursor: pointer;
}
.badge[data-tone="ok"] { color: var(--ok); border-color: var(--ok); }
.badge[data-tone="warning"] { color: var(--warning); border-color: var(--warning); }
.badge[data-tone="ended"] { color: var(--danger); border-color: var(--danger); }
.badge[data-tone="muted"] { color: var(--accent); border-color: var(--accent); }
.save-status { font-size: 13px; color: var(--muted); }
.save-status[data-tone="error"] { color: var(--danger); font-weight: 700; }

/* Pestañas */
.tabs {
  display: flex; gap: 4px; padding: 0 20px; background: var(--bg-2);
  border-bottom: 1px solid var(--border); overflow-x: auto;
}
.tabs button {
  border: 0; background: none; padding: 12px 14px; cursor: pointer; color: var(--muted);
  border-bottom: 3px solid transparent; white-space: nowrap; font-weight: 700;
}
.tabs button:hover { color: var(--text); }
.tabs button.is-active { color: var(--accent); border-bottom-color: var(--accent); }

.main { padding: 24px 20px; max-width: 1400px; margin: 0 auto; outline: none; }
.main.is-guide { max-width: 980px; }
.app-footer { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 20px 28px; }

/* Botones y campos */
.btn {
  border: 2px solid var(--border); background: transparent; border-radius: 6px;
  padding: 7px 16px; cursor: pointer; font-weight: 700; text-decoration: none; display: inline-block;
  color: var(--text);
}
.btn:hover { border-color: var(--primary); color: var(--text); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 900; }
.btn.primary:hover { background: #fff; border-color: #fff; color: var(--accent-text); }
.btn.ghost { border-color: transparent; }
.btn.ghost:hover { border-color: var(--border); }
.btn.danger { color: var(--danger); }
.btn.large { padding: 12px 32px; font-size: 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
:is(.btn, .badge, .tabs button, .icon-btn, .card-title, .card-link, .guide-dot, .roadmap-step, a):focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

// Tutorial independiente para subir el juego a itch.io (extraído del WGJ Team Board).
(() => {
  const LANGUAGES = Object.freeze(['es', 'en', 'pt']);
  const LANGUAGE_STORAGE_KEY = 'wgj-itch-guide.language';
  const STEP_HASH_PREFIX = '#step-';
  const { dictionaries, steps } = GUIDE_DATA;

  const elements = {
    title: document.getElementById('page-title'),
    languageLabel: document.getElementById('language-label'),
    languageSelect: document.getElementById('language-select'),
    stepBar: document.getElementById('step-bar'),
    view: document.getElementById('view'),
    stepNav: document.getElementById('step-nav'),
  };

  let language = readInitialLanguage();
  let stepIndex = readStepFromHash();

  function readInitialLanguage() {
    try {
      const saved = window.localStorage.getItem(LANGUAGE_STORAGE_KEY);
      if (LANGUAGES.includes(saved)) return saved;
    } catch {
      // Sin storage se usa el idioma del navegador.
    }
    const browserLanguage = (navigator.language || 'es').slice(0, 2).toLowerCase();
    return LANGUAGES.includes(browserLanguage) ? browserLanguage : 'es';
  }

  function saveLanguage() {
    try {
      window.localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
    } catch {
      // La preferencia vive solo en esta sesión.
    }
  }

  function readStepFromHash() {
    const number = Number.parseInt(window.location.hash.slice(STEP_HASH_PREFIX.length), 10);
    return Number.isInteger(number) && number >= 1 && number <= steps.length ? number - 1 : 0;
  }

  const t = (key, params = {}) => {
    const template = dictionaries[language]?.[key] ?? dictionaries.es[key] ?? key;
    return template.replace(/\{(\w+)\}/g, (_, name) => String(params[name] ?? ''));
  };

  // Siempre textContent: ningún texto se interpreta como HTML.
  function h(tag, props = {}, ...children) {
    const element = document.createElement(tag);
    children.flat(Infinity).forEach((child) => {
      if (child === null || child === undefined || child === false) return;
      element.append(child instanceof Node ? child : document.createTextNode(String(child)));
    });
    Object.entries(props).forEach(([key, value]) => {
      if (value === undefined || value === null || value === false) return;
      if (key === 'class') element.className = value;
      else if (key.startsWith('on') && typeof value === 'function') element.addEventListener(key.slice(2), value);
      else element.setAttribute(key, value === true ? '' : String(value));
    });
    return element;
  }

  const externalLink = (label, url) => h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, label);

  function renderBlock(step, block) {
    if (block.type === 'link') return h('p', {}, externalLink(t(`itch.link.${block.key}`), block.url));
    if (block.type === 'image') {
      return h('img', { class: 'shot', src: block.src, alt: t(`itch.${step.id}.${block.altKey}`), loading: 'lazy' });
    }
    return h('p', { class: block.type === 'note' ? 'note' : null }, t(`itch.${step.id}.${block.key}`));
  }

  function renderStep() {
    const step = steps[stepIndex];
    return h('div', { class: 'guide-step itch-step' },
      h('header', { class: 'step-header' },
        h('p', { class: 'step-kicker' }, t('itch.kicker', { current: stepIndex + 1, total: steps.length })),
        h('h2', { class: 'step-title' }, t(`itch.${step.id}.title`)),
        h('p', { class: 'step-summary' }, t(`itch.${step.id}.summary`))),
      h('section', { class: 'panel' }, step.blocks.map((block) => renderBlock(step, block))));
  }

  function renderStepBar() {
    const dot = (step, index) => {
      const isCurrent = index === stepIndex;
      const label = `${index + 1}. ${t(`itch.${step.id}.title`)}`;
      return h('li', {}, h('button', {
        class: `guide-dot${isCurrent ? ' is-current' : ''}`, type: 'button', title: label, 'aria-label': label,
        'aria-current': isCurrent ? 'step' : null,
        onclick: () => goToStep(index),
      }, index + 1));
    };
    return [h('ol', { class: 'guide-dots' }, steps.map(dot))];
  }

  function renderStepNav() {
    const hasPrevious = stepIndex > 0;
    const hasNext = stepIndex < steps.length - 1;
    return [
      hasPrevious
        ? h('button', { class: 'btn ghost', type: 'button', onclick: () => goToStep(stepIndex - 1) }, t('guide.back'))
        : null,
      h('span', { class: 'spacer' }),
      hasNext
        ? h('button', { class: 'btn primary large', type: 'button', onclick: () => goToStep(stepIndex + 1) }, t('guide.next'))
        : null,
    ].filter(Boolean);
  }

  function render() {
    document.documentElement.lang = language;
    document.title = t('page.title');
    elements.title.textContent = t('page.title');
    elements.languageLabel.textContent = t('header.language');
    elements.languageSelect.value = language;
    elements.stepBar.replaceChildren(...renderStepBar());
    elements.view.replaceChildren(renderStep());
    elements.stepNav.replaceChildren(...renderStepNav());
  }

  function goToStep(index) {
    stepIndex = index;
    history.replaceState(null, '', `${STEP_HASH_PREFIX}${index + 1}`);
    render();
    window.scrollTo(0, 0);
    elements.view.focus({ preventScroll: true });
  }

  elements.languageSelect.addEventListener('change', (event) => {
    if (!LANGUAGES.includes(event.target.value)) return;
    language = event.target.value;
    saveLanguage();
    render();
  });

  window.addEventListener('hashchange', () => {
    stepIndex = readStepFromHash();
    render();
  });

  render();
})();

</script>
</body>
</html>
